<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="LuxyOS: de ring laadt en het zonnetje gaat aan">
  <style>
    @keyframes lxRing { from { stroke-dashoffset: 99; } to { stroke-dashoffset: 0; } }
    @keyframes lxZon { 0%, 68% { opacity: 0; transform: scale(0.2); } 84% { opacity: 1; transform: scale(1.35); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes lxGloed { 0%, 72% { opacity: 0; transform: scale(0.4); } 88% { opacity: 0.55; transform: scale(1.5); } 100% { opacity: 0.28; transform: scale(1.15); } }
    .ring { animation: lxRing 1.1s cubic-bezier(.4,0,.2,1) both; }
    .zon, .gloed { transform-box: fill-box; transform-origin: center; }
    .zon { animation: lxZon 1.6s ease-out both; }
    .gloed { animation: lxGloed 1.6s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .ring, .zon, .gloed { animation: none; } }
  </style>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#13243B" stroke-opacity="0.1" stroke-width="6"/>
  <circle class="ring" cx="32" cy="32" r="21" fill="none" stroke="#13243B" stroke-width="6" stroke-linecap="round" stroke-dasharray="99 200" transform="rotate(-30 32 32)"/>
  <circle class="gloed" cx="37.4" cy="11.7" r="10" fill="#F5A524" opacity="0.28"/>
  <circle class="zon" cx="37.4" cy="11.7" r="5.5" fill="#F5A524"/>
</svg>
